name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['git-agent-tags--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            npm-pkg: darwin-arm64
          - name: darwin-x64
            os: macos-14
            target: x86_64-apple-darwin
            npm-pkg: darwin-x64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            npm-pkg: linux-x64
          - name: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            npm-pkg: linux-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: git-agent-tags
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Copy binary to npm package
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            ext=".exe"
          fi
          mkdir -p "npm/${{ matrix.npm-pkg }}/bin"
          cp "git-agent-tags/target/${{ matrix.target }}/release/git-agent-tags${ext}" \
             "npm/${{ matrix.npm-pkg }}/bin/git-agent-tags${ext}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm-pkg }}
          path: npm/${{ matrix.npm-pkg }}

  publish:
    name: Publish to npm
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy binaries into npm packages
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            cp -r artifacts/npm-${pkg}/* npm/${pkg}/
            chmod +x npm/${pkg}/bin/* 2>/dev/null || true
          done

      - name: Set version from tag
        run: |
          TAG=${{ needs.release-please.outputs.tag_name }}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Update all package.json versions
          for dir in npm/agent-tags npm/darwin-arm64 npm/darwin-x64 npm/linux-x64 npm/linux-arm64; do
            cd $dir
            npm version $VERSION --no-git-tag-version --allow-same-version
            cd $GITHUB_WORKSPACE
          done
          # Update optionalDependencies versions in main package
          cd npm/agent-tags
          node -e "
            const pkg = require('./package.json');
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '$VERSION';
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish platform packages
        run: |
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            cd npm/${pkg}
            npm publish --access public --provenance
            cd $GITHUB_WORKSPACE
          done

      - name: Publish main package
        run: |
          cd npm/agent-tags
          npm publish --access public --provenance
