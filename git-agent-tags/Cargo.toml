[package]
name = "git-agent-tags"
version = "0.1.2"
edition = "2021"
description = "Parse and validate @agents tags in codebases"
license = "MIT"
repository = "https://github.com/cabljac/agent-tags"
homepage = "https://agenttags.dev"
documentation = "https://agenttags.dev"
readme = "README.md"
authors = ["Jacob Cable"]
keywords = ["git", "agents", "ai", "annotations", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-agent-tags"
path = "src/main.rs"

[dependencies]
git2 = "0.19"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
colored = "2"
toml = "0.8"
walkdir = "2"
anyhow = "1"
glob = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
